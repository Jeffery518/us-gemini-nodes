name: Update US Gemini Nodes

on:
  schedule:
    - cron: '0 */2 * * *' # 缩短至每 2 小时自动运行一次，保证节点超高新鲜度，杜绝长期死节点
  workflow_dispatch: # 允许在 Actions 页面手动点按钮立即运行

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Download subs-check
        run: |
          curl -fsSL -o subs-check.tar.gz "https://github.com/beck-8/subs-check/releases/latest/download/subs-check_Linux_x86_64.tar.gz"
          tar -xzf subs-check.tar.gz
          chmod +x subs-check done.sh
          mkdir -p output

      - name: Run subs-check once
        run: |
          # 最长运行 20 分钟兜底；正常跑完会由 done.sh 提前退出
          timeout 20m ./subs-check -f config.yaml || true

      - name: Build full Clash configuration for mobile clients
        run: |
          python build_full_clash.py

      - name: Commit updated subscriptions
        run: |
          if [ -s output/all.yaml ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add output/all.yaml output/clash.yaml
            git diff --cached --quiet || git commit -m "chore: update US Gemini nodes and clash profile $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "output/all.yaml is empty, keeping previous snapshot."
          fi
