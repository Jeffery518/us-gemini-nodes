print-progress: false
concurrent: 50
media-concurrent: 20
speed-concurrent: 15
shuffle-test-order: true
check-interval: 120
success-limit: 100 # 扩大筛选池至 100 个全球优质节点
timeout: 2500 # 云端握手超时缩短至 2.5 秒，严酷淘汰高延迟与濒死节点
alive-test-url: https://www.gstatic.com/generate_204 # 改用带 TLS 握手的 HTTPS 端点检测
speed-test-url: https://github.com/AaronFeng753/Waifu2x-Extension-GUI/releases/download/v2.21.12/Waifu2x-Extension-GUI-v2.21.12-Portable.7z
min-speed: 1024 # 最低下载速度提高到 1024 KB/s (1MB/s)，彻底淘汰网络拥堵的劣质节点
download-timeout: 8
download-mb: 10
rename-node: true # 按 IP 自动重命名（带国家/地区标识）
media-check: true # 开启解锁检测
media-check-timeout: 4
platforms: # 检测 IP 风险与 Gemini 解锁状态
  - iprisk
  - gemini
# 全球主流地区优质节点覆盖（美国、新加坡、日本、香港、台湾、英国、韩国等）
filter:
  - "(?i)(美国|🇺🇸|US|新加坡|🇸🇬|SG|日本|🇯🇵|JP|香港|🇭🇰|HK|台湾|🇹🇼|TW|英国|🇬🇧|UK|韩国|🇰🇷|KR)"
enable-web-ui: false
sub-store-port: "" # 关闭内置 sub-store，节省云端资源
save-method: local
output-dir: "./output"
callback-script: "./done.sh" # 检测完成后自动退出进程，避免 Actions 一直挂起

# 远程订阅合集源（包含上百个上游公开源列表，云端自动展开拉取）
sub-urls-remote:
  # beck-8 维护的“高大全”合集（内置 50+ 顶级公开订阅源）
  - "https://raw.githubusercontent.com/beck-8/sub-urls/refs/heads/main/%E9%AB%98%E5%A4%A7%E5%85%A8.txt"
  # beck-8 维护的精选“小而美”合集
  - "https://raw.githubusercontent.com/beck-8/sub-urls/refs/heads/main/%E5%B0%8F%E8%80%8C%E7%BE%8E.txt"
  # 非 GitHub 聚合订阅（第三方免费机场与自建 Worker 节点）
  - "https://raw.githubusercontent.com/beck-8/sub-urls/refs/heads/main/%E9%9D%9EGITHUB.txt"

